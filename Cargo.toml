[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Davide Lusuardi"]
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
good_lp = { version = "1.15.3", default-features = false, features = ["highs"] }
jsonschema = { version = "0.58.1", default-features = false }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
